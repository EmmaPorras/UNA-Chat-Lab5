
name: Pruebas y despliegue UNA Chat en Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Ejecutar pruebas del chat
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: despues

    steps:
      - name: Descargar codigo de GitHub
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: despues/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Ejecutar pruebas de integracion
        run: npm run test:integration

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas end-to-end
        run: npm run test:e2e

  desplegar:
    name: Desplegar en Render
    needs: pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Solicitar despliegue del commit aprobado
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --get --data-urlencode "ref=${GITHUB_SHA}" \
            "$RENDER_DEPLOY_HOOK_URL"
